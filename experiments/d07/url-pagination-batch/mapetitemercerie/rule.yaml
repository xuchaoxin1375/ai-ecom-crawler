schema_version: "1.1"
rule_id: "mapetitemercerie-url-pages"
rule_version: "2026.11.21-1"
kind: declarative
status: candidate

site:
  name: "Ma Petite Mercerie"
  entry_urls: ["https://www.mapetitemercerie.com/fr/1499-tissus-mode"]
  allowed_origins: ["https://www.mapetitemercerie.com"]
  allowed_path_prefixes: ["/fr/"]
  market: "FR"
  locale: "fr-FR"
  currency: "EUR"

scope:
  include: ['^/fr/[^/]+/\d+-(?!\d+-)[^/]+\.html$']
  exclude: ["/panier", "/commande", "/connexion", "/mon-compte"]

capabilities:
  discovery: true
  product: true

discovery:
  sources:
    - type: listing
      url: "https://www.mapetitemercerie.com/fr/1499-tissus-mode"
      product_link_selector: '#js-product-list article.product-miniature p.product-miniature__name a'
      advance:
        type: page_param
        param: "page"
        start: 1
        max_pages: 2
  product_url_patterns: ['^/fr/[^/]+/\d+-(?!\d+-)[^/]+\.html$']
  url_identity: "canonical"

fetch:
  default_engine: "static"
  concurrency: 1
  delay_ms: 1000
  retry: {max_attempts: 2, backoff_ms: 1000}
  timeout_ms: 45000
  browser: false
  login: false
  challenge_handling: "none; stop and record"

extract:
  fields:
    name:
      required: true
      fallbacks:
        - {type: css_text, selector: "h1.product-name", label: "product_name"}
        - {type: css_text, selector: "h1", label: "h1"}
    price.amount:
      required: true
      fallbacks:
        - {type: css_attr, selector: 'meta[property="product:price:amount"]', attr: "content", label: "meta_price"}
        - {type: css_text, selector: "span.current-price", label: "current_price"}
    price.currency:
      required: true
      fallbacks:
        - {type: css_attr, selector: 'meta[property="product:price:currency"]', attr: "content", label: "meta_currency"}
    primary_image_url:
      required: true
      fallbacks:
        - {type: css_attr, selector: 'meta[property="og:image"]', attr: "content", label: "og_image", absolute: true}
    description_html:
      required: false
      fallbacks:
        - {type: css_html, selector: ".product-description", label: "description", description_status: "complete"}
        - {type: css_html, selector: ".product-description-short", label: "short_description", description_status: "partial"}
    category:
      required: false
      fallbacks:
        - type: breadcrumb
          selector: "ol.breadcrumb a"
          label: "breadcrumb"
          drop_last: true
          exclude: ["Accueil"]
    brand:
      required: false
      fallbacks:
        - {type: css_text, selector: ".product-manufacturer a", label: "manufacturer"}
    source_url:
      required: true
      fallbacks:
        - {type: canonical, label: "canonical"}

normalize:
  price:
    tax_basis: "INCLUSIVE"
    choose: "smaller_public_pair"
    positive_only: true
  description:
    mode: "clean_html"
    statuses: ["complete", "partial", "fallback", "not_provided", "failed"]
  options:
    exclude_quantity: true
    strip_price_delta: true

validate:
  required_fields:
    - "name"
    - "price.amount"
    - "price.currency"
    - "primary_image_url"
    - "source_url"
  assertions:
    - {field: "price.amount", op: ">", value: 0}
    - {field: "price.currency", op: "matches", value: "^[A-Z]{3}$"}
  partial_description: "allowed_with_flag"

output:
  url_list:
    enabled: true
    columns: ["url", "source", "status", "title"]
    format: "csv"
  product_csv:
    enabled: true
    columns: 9
    format: "csv"
  task_result: true

task_defaults:
  max_urls: 30
  max_products: 10
  max_seconds: 180
  concurrency:
    navigation: 1
    product: 1

compatibility:
  os: ["windows", "linux", "wsl2"]
  runtime: "python>=3.11"
  dependencies: ["scrapling==0.5.1"]
  browser: "none; direct URL pagination"

evidence:
  sample_urls:
    - "https://www.mapetitemercerie.com/fr/1499-tissus-mode"
    - "https://www.mapetitemercerie.com/fr/1499-tissus-mode?page=2"
  expected: []
  verified_at: null
  limitations:
    - "Benchmark French fabric site; bounded sample of the first two category pages."
    - "PrestaShop listing exposes ?page=N; product cards also carry variant URLs, so the scope keeps only the base product URL (one number before the slug)."
    - "Prices are the site's current TTC display; no shipping or variant audit."

notes: "URL-addressable pagination on a benchmark site: the listing returns page 2 via ?page=N, so page_param is used instead of scrolling or clicking."
