<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>任务运行分析 · 静态原型</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231f5c4a'/%3E%3Cpath d='M4 11V8m3 3V5m3 6V7m3 4V3' stroke='white' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script>
      try {
        const chrome = new URLSearchParams(location.search).get("chrome");
        if (chrome === "0") document.documentElement.dataset.chrome = "0";
      } catch (_) {}
    </script>
  </head>
  <body>
    <div class="prototype-bar" id="prototype-bar">
      <div class="prototype-title">
        <span class="prototype-kicker">评审辅助</span>
        <strong>任务运行分析 · 静态原型</strong>
        <span>不连接 API；数据为真实运行聚合与合成请求遥测</span>
      </div>
      <div class="prototype-controls">
        <div class="state-switch" role="group" aria-label="运行状态">
          <button type="button" data-run-state="finished">已结束</button>
          <button type="button" data-run-state="running">运行中</button>
          <button type="button" data-run-state="legacy">旧运行</button>
          <button type="button" data-run-state="queued">未开始</button>
        </div>
        <button type="button" class="prototype-hide" id="hide-chrome">隐藏控制条</button>
      </div>
    </div>

    <div class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <a class="brand" href="#/workbench" aria-label="电商采集">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
              <path d="m10 2.8 6.2 3.4v7.6L10 17.2l-6.2-3.4V6.2z" />
              <path d="m3.8 6.2 6.2 3.4 6.2-3.4M10 9.6v7.6" />
            </svg>
          </span>
          <span class="brand-copy">
            <strong>电商采集</strong>
            <small>本地控制台</small>
          </span>
        </a>

        <nav class="nav" aria-label="工作区">
          <p class="nav-label">工作区</p>
          <a class="nav-item" href="#/workbench">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                <rect x="2.5" y="2.5" width="6" height="6" rx="1" />
                <rect x="11.5" y="2.5" width="6" height="6" rx="1" />
                <rect x="2.5" y="11.5" width="6" height="6" rx="1" />
                <rect x="11.5" y="11.5" width="6" height="6" rx="1" />
              </svg>
            </span>
            任务工作台
          </a>
          <a class="nav-item is-active" href="#/tasks" aria-current="page">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M4 4.5h12M4 10h12M4 15.5h8" stroke-linecap="round" />
              </svg>
            </span>
            全部任务
          </a>
          <a class="nav-item" href="#/builds">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M3 16.5h14M4.5 14V9l3 2 2.5-5 2.5 4 3-3v7" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </span>
            构建记录
          </a>
          <p class="nav-label">系统</p>
          <a class="nav-item" href="#/models">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                <circle cx="10" cy="10" r="3" />
                <path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M15.3 4.7l-1.4 1.4M6.1 13.9l-1.4 1.4" stroke-linecap="round" />
              </svg>
            </span>
            模型配置
          </a>
          <a class="nav-item" href="#/settings">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M4 5.5h12M4 10h12M4 14.5h12" stroke-linecap="round" />
                <circle cx="7" cy="5.5" r="1.4" fill="var(--surface)" />
                <circle cx="13" cy="10" r="1.4" fill="var(--surface)" />
                <circle cx="8.5" cy="14.5" r="1.4" fill="var(--surface)" />
              </svg>
            </span>
            系统设置
          </a>
        </nav>

        <div class="sidebar-footer">
          <span class="status-dot" aria-hidden="true"></span>
          <span>本地单用户 · 回环地址</span>
        </div>
      </aside>

      <div class="app-main">
        <header class="topbar">
          <div class="breadcrumb" aria-label="面包屑">
            <a href="#/tasks">全部任务</a>
            <span aria-hidden="true">/</span>
            <span>任务详情</span>
            <span aria-hidden="true">/</span>
            <strong>运行分析</strong>
          </div>
          <div class="topbar-right">
            <span class="prototype-pill">静态原型 · 模拟数据</span>
            <span class="service-pill"><i aria-hidden="true"></i>服务正常 · 托管 worker</span>
          </div>
        </header>

        <main id="page" class="page" tabindex="-1"></main>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <!-- Apache-2.0; prototype-only vendored build, see vendor/LICENSE. -->
    <script src="./vendor/echarts.min.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
