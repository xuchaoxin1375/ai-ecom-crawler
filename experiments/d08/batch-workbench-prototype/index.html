<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>批次工作台 · 前端原型</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <a class="brand" href="#/batches">
          <span class="brand-mark" aria-hidden="true">采</span>
          <span>
            <strong>电商采集</strong>
            <small>本地控制台</small>
          </span>
        </a>

        <nav class="nav">
          <a href="#/batches" data-nav="batches">采集批次</a>
          <a href="#/tasks" data-nav="tasks">全部任务</a>
          <a href="#/rules" data-nav="rules">规则包 <span class="nav-tag">技术</span></a>
        </nav>

        <div class="sidebar-note">
          <span class="note-label">工作方式</span>
          <p>先组织一批站点，再判断可采性、启动采集、查看结果。</p>
        </div>

        <div class="sidebar-footer">
          <span class="status-dot" aria-hidden="true"></span>
          本地单用户 · 回环地址
        </div>
      </aside>

      <div class="app-main">
        <header class="topbar">
          <div>
            <div class="breadcrumb" id="breadcrumb">采集批次</div>
            <div class="topbar-sub" id="topbar-sub">从一批站点开始，而不是从规则包开始</div>
          </div>
          <div class="topbar-right">
            <span class="prototype-badge">静态原型 · 模拟数据</span>
            <span class="env-badge">本地</span>
          </div>
        </header>

        <main id="view" tabindex="-1"></main>
      </div>
    </div>

    <dialog id="dialog" class="dialog">
      <form method="dialog" class="dialog-inner">
        <div class="dialog-head">
          <h2 id="dialog-title">确认</h2>
          <button class="icon-button" value="cancel" aria-label="关闭">×</button>
        </div>
        <div id="dialog-body" class="dialog-body"></div>
        <div class="dialog-actions">
          <button class="button button-quiet" value="cancel">取消</button>
          <button class="button button-primary" id="dialog-confirm" value="confirm">确认</button>
        </div>
      </form>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
