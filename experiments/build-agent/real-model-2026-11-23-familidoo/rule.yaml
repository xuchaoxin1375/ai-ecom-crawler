schema_version: '1.1'
rule_id: familidoo-fr-build
rule_version: 2026.11.23-1
kind: declarative
status: candidate
created_at: '2026-11-23T00:00:00Z'
updated_at: '2026-11-22T19:35:30Z'
site:
  name: Familidoo
  entry_urls:
  - https://www.familidoo.fr/fr/
  allowed_origins:
  - https://www.familidoo.fr
  allowed_path_prefixes:
  - /fr/
  market: FR
  locale: fr-FR
  currency: EUR
scope:
  include: []
  exclude:
  - /fr/panier
  - /fr/commande
  - /fr/connexion
  - /fr/mon-compte
  - /fr/avoirs
  - /fr/recherche
  - /fr/nous-contacter
  max_products: 3
  max_seconds: 600
  notes: Bounded entry-page sample (home page product carousels). Three products by
    default; not full-site coverage.
capabilities:
  discovery: true
  product: true
discovery:
  strategies:
  - entry_links
  entry_url: https://www.familidoo.fr/fr/
  link_selector: a.product_img_link
  product_url_patterns:
  - ^/fr/(?:[^/]+/)?\d+-[^/]+\.html$
  url_identity: canonical
  notes: The home page renders product cards as <article class="ajax_block_product
    js-product-miniature"> with an <a class="product_img_link" href="..."> to each
    product; six cards, five unique products. Product URLs are /fr/<category>/<id>-<slug>.html.
    No sitemap or listing crawl was needed.
fetch:
  default_engine: static
  concurrency: 1
  delay_ms: 1200
  retry:
    max_attempts: 2
    backoff_ms: 1000
  timeout_ms: 45000
  browser: false
  login: false
  challenge_handling: none; stop and record
extract:
  fields:
    name:
      required: true
      fallbacks:
      - type: css_text
        selector: h1.product_name
        label: h1_product_name
      - type: css_text
        selector: h1[itemprop="name"]
        label: h1_itemprop_name
      - type: css_attr
        selector: meta[property="og:title"]
        attr: content
        label: og_title
      - type: title
        label: title
      - type: json_ld
        path: name
        label: json_ld_name
    price.amount:
      required: true
      fallbacks:
      - type: css_attr
        selector: span[itemprop="price"]
        attr: content
        label: microdata_price
      - type: css_attr
        selector: meta[property="product:price:amount"]
        attr: content
        label: og_product_price
      - type: css_text
        selector: .current-price .price
        label: current_price_text
        take: first
      - type: json_ld
        path: offers.price
        label: json_ld_offer_price
        take: min_positive
        tax_basis: unspecified
    price.currency:
      required: true
      fallbacks:
      - type: css_attr
        selector: meta[itemprop="priceCurrency"]
        attr: content
        label: microdata_currency
      - type: css_attr
        selector: meta[property="product:price:currency"]
        attr: content
        label: og_product_currency
      - type: json_ld
        path: offers.priceCurrency
        label: json_ld_currency
    primary_image_url:
      required: true
      fallbacks:
      - type: css_attr
        selector: meta[property="og:image"]
        attr: content
        label: og_image
        absolute: true
      - type: css_attr
        selector: img.pro_gallery_item[itemprop="image"]
        attr: content
        label: gallery_item_content
        absolute: true
      - type: css_attr
        selector: img.pro_gallery_item
        attr: src
        label: gallery_item_src
        absolute: true
      - type: json_ld
        path: image
        label: json_ld_image
    description_html:
      required: false
      fallbacks:
      - type: css_html
        selector: '#description .product-description'
        label: product_tab_description
        description_status: complete
      - type: css_html
        selector: '#description .product_description_container'
        label: description_container
        description_status: complete
      - type: css_attr
        selector: meta[property="og:description"]
        attr: content
        label: og_description
        description_status: partial
      - type: json_ld
        path: description
        label: json_ld_description
        description_status: partial
    category:
      required: false
      fallbacks:
      - type: breadcrumb
        selector: nav.breadcrumb_nav li[itemprop='itemListElement'] a span[itemprop='name']
        label: breadcrumb_path
        drop_last: true
      - type: json_ld
        path: category
        label: json_ld_category
    brand:
      required: false
      fallbacks:
      - type: css_text
        selector: .product-manufacturer a
        label: manufacturer_link
      - type: json_ld
        path: brand.name
        label: json_ld_brand
    source_url:
      required: true
      fallbacks:
      - type: canonical
        label: canonical
normalize:
  price:
    tax_basis: exclusive_or_inclusive
    choose: smaller_public_pair
    positive_only: true
  description:
    mode: clean_html
    statuses:
    - complete
    - partial
    - not_provided
    - failed
  options:
    exclude_quantity: true
    strip_price_delta: true
validate:
  required_fields:
  - name
  - price.amount
  - price.currency
  - primary_image_url
  - source_url
  assertions:
  - field: price.amount
    op: '>'
    value: 0
  - field: price.currency
    op: matches
    value: ^[A-Z]{3}$
  partial_description: allowed_with_flag
output:
  url_list:
    enabled: true
    columns:
    - url
    - source
    - status
    - title
    format: csv
  product_csv:
    enabled: true
    columns: 9
    format: csv
  task_result: true
task_defaults:
  max_urls: 12
  max_products: 3
  max_seconds: 600
  concurrency:
    navigation: 1
    product: 1
compatibility:
  os:
  - windows
  - linux
  - wsl2
  runtime: python>=3.11
  dependencies:
  - pyyaml
  - lxml
evidence:
  sample_urls:
  - https://www.familidoo.fr/fr/poussette-compacte/183-poussette-compacte-lidoo-one-noire-4712928373475.html
  - https://www.familidoo.fr/fr/poussette-quadruple/193-poussette-4-places-lidoo-city-h4e-full-grey-4712928374274.html
  - https://www.familidoo.fr/fr/poussette-quadruple/8-poussette-4-places-lidoo-star-dj04frl-4712928372676.html
  - https://www.familidoo.fr/fr/poussette-quadruple/74464-poussette-4-places-lidoo-lite-cosmic-black-0615402035002.html
  expected:
  - Three valid products from the home-page carousel sample, priced in EUR.
  limitations:
  - Product pages carry no Product JSON-LD; json_ld fallbacks are kept last and are
    expected to miss.
  - Old (crossed-out) price sits next to the sale price; the price.amount fallbacks
    read itemprop/og meta of the current price only.
  - Variant options are not exposed on the two sampled products (.product-variants
    is empty), so no options field is declared.
  - Only the home page and two product pages were sampled; category listing, sitemap
    and pagination were not crawled.
  - Host validation is a bounded sample, not full-site or long-term coverage.
  host_validation:
    validated_at: '2026-11-22T19:35:30Z'
    build_id: build-d968105688f3
    valid_products: 3
    failed_products: 0
    stop_reason: NATURAL_END
    outcome: COMPLETED
    currencies: {}
