schema_version: "1.1"
rule_id: "shopthebulkstore-html-index-runtime"
rule_version: "2026.11.20-1"
kind: declarative
status: candidate
created_at: "2026-11-20T14:00:00Z"
updated_at: "2026-11-20T14:00:00Z"

site:
  name: "The Bulk Store"
  entry_urls: ["https://shopthebulkstore.com/all-products"]
  allowed_origins: ["https://shopthebulkstore.com"]
  allowed_path_prefixes: ["/"]
  market: "US"
  locale: "en-US"
  currency: "USD"

scope:
  include: ['^/[a-z0-9][a-z0-9-]*$']
  exclude:
    - "/checkout/"
    - "/customer/"
    - "/cart/"
    - "/catalog/"
    - "/catalogsearch/"
    - "/review/"
    - "/sendfriend/"
    - "/wishlist/"
  max_products: 30
  max_seconds: 120
  notes: "P1 HTML index discovery smoke: /all-products as a single HTML index; first 30 product URLs; no product fetch."

capabilities:
  discovery: true
  product: false

discovery:
  sources:
    - type: "html_index"
      url: "https://shopthebulkstore.com/all-products"
      link_selector: "a.product-item-link"
      max_depth: 0
  product_url_patterns: ['^/[a-z0-9][a-z0-9-]*$']
  url_identity: "canonical"
  limits:
    max_navigation: 3
    max_products: 30

fetch:
  default_engine: "static"
  concurrency: 1
  delay_ms: 1000
  retry: {max_attempts: 2, backoff_ms: 1000}
  timeout_ms: 45000
  challenge: "stop_and_record"

output:
  url_list:
    enabled: true
    columns: ["url", "source", "status", "title"]
    format: "csv"
  product_csv:
    enabled: false
  task_result: true

task_defaults:
  max_urls: 30
  max_products: 30
  max_seconds: 120
  max_attempts: 2
  retry_backoff_ms: 1000
  concurrency:
    navigation: 1
    product: 1

compatibility:
  os: ["windows", "linux", "wsl2"]
  runtime: "python>=3.11"

notes: "S5 /all-products HTML index discovery; no sitemap and no product pages; derived from experiments/d01/shopthebulkstore."
