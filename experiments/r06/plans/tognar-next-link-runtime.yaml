schema_version: "1.1"
rule_id: "tognar-next-link-runtime"
rule_version: "2026.11.20-1"
kind: declarative
status: candidate
created_at: "2026-11-20T15:30:00Z"
updated_at: "2026-11-20T15:30:00Z"

site:
  name: "Tognar Toolworks"
  entry_urls: ["https://www.tognar.com/ski-wax-and-snowboard-wax/"]
  allowed_origins: ["https://www.tognar.com"]
  allowed_path_prefixes: ["/"]
  market: "US"
  locale: "en-US"
  currency: "USD"

scope:
  include: ['^/[a-z0-9][a-z0-9-]+/$']
  exclude:
    - "/cart.php"
    - "/login.php"
    - "/giftcertificates.php"
    - "/compare"
  max_products: 30
  max_seconds: 180
  notes: "P1 next_link discovery smoke: category /ski-wax-and-snowboard-wax/ pages 1-3; first 30 product URLs; no product fetch."

capabilities:
  discovery: true
  product: false

discovery:
  sources:
    - type: "listing"
      url: "https://www.tognar.com/ski-wax-and-snowboard-wax/"
      product_link_selector: ".productGrid .card-title a"
      advance:
        type: "next_link"
        selector: "link[rel=next]"
        max_pages: 3
  product_url_patterns: ['^/[a-z0-9][a-z0-9-]+/$']
  url_identity: "canonical"
  limits:
    max_navigation: 5
    max_pages: 3
    max_products: 30

fetch:
  default_engine: "static"
  concurrency: 1
  delay_ms: 10000
  retry: {max_attempts: 2, backoff_ms: 2000}
  timeout_ms: 45000
  challenge: "stop_and_record"

output:
  url_list:
    enabled: true
    columns: ["url", "source", "status", "title"]
    format: "csv"
  product_csv:
    enabled: false
  task_result: true

task_defaults:
  max_urls: 30
  max_products: 30
  max_seconds: 180
  max_attempts: 2
  retry_backoff_ms: 2000
  concurrency:
    navigation: 1
    product: 1

compatibility:
  os: ["windows", "linux", "wsl2"]
  runtime: "python>=3.11"

notes: "S? baseline site for next_link: head <link rel=next>; no sitemap; 12 cards per page. Derived from docs/12."
