schema_version: "1.1"
rule_id: "sixmoondesigns-products-json-runtime"
rule_version: "2026.11.20-1"
kind: declarative
status: candidate
created_at: "2026-11-20T14:30:00Z"
updated_at: "2026-11-20T14:30:00Z"

site:
  name: "Six Moon Designs"
  entry_urls: ["https://www.sixmoondesigns.com/?country=US"]
  allowed_origins: ["https://www.sixmoondesigns.com"]
  allowed_path_prefixes: ["/"]
  market: "US"
  locale: "en-US"
  currency: "USD"

scope:
  include: ['^/products/[^/]+$']
  exclude:
    - "/cart"
    - "/checkout"
    - "/account"
    - "/orders"
  max_products: 30
  max_seconds: 120
  notes: "P1 public JSON discovery smoke: products.json page 1, first 30 product URLs; no product fetch."

capabilities:
  discovery: true
  product: false

discovery:
  sources:
    - type: "public_json"
      url: "https://www.sixmoondesigns.com/products.json?limit=250&page=1&country=US"
      items_path: "products"
      url_template: "https://www.sixmoondesigns.com/products/{handle}"
      pagination:
        type: "page_param"
        param: "page"
        start: 1
        max_pages: 1
  product_url_patterns: ['^/products/[^/]+$']
  url_identity: "canonical"
  limits:
    max_navigation: 3
    max_products: 30

fetch:
  default_engine: "static"
  concurrency: 1
  delay_ms: 1000
  retry: {max_attempts: 2, backoff_ms: 1000}
  timeout_ms: 45000
  challenge: "stop_and_record"

output:
  url_list:
    enabled: true
    columns: ["url", "source", "status", "title"]
    format: "csv"
  product_csv:
    enabled: false
  task_result: true

task_defaults:
  max_urls: 30
  max_products: 30
  max_seconds: 120
  max_attempts: 2
  retry_backoff_ms: 1000
  concurrency:
    navigation: 1
    product: 1

compatibility:
  os: ["windows", "linux", "wsl2"]
  runtime: "python>=3.11"

notes: "S4 public JSON discovery; products.json page 1 only; no product pages; derived from experiments/d01/sixmoondesigns."
