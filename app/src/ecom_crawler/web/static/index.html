<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>采集任务 · 本地控制台</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="#/tasks">电商采集</a>
      <span class="badge">本地控制台</span>
      <span class="hint">控制请求由托管 worker 执行；页面关闭不停止后台</span>
    </header>

    <main id="app">
      <section id="list-view">
        <div class="page-head list-head">
          <h1>任务</h1>
          <button id="refresh-list" type="button">刷新</button>
        </div>

        <details class="panel create-panel">
          <summary>创建任务</summary>
          <form id="create-form" class="create-form">
            <label>
              规则包
              <select id="rule-select" required>
                <option value="">加载中…</option>
              </select>
            </label>
            <label>
              类型
              <select id="create-type">
                <option value="product">商品</option>
                <option value="discovery">发现</option>
              </select>
            </label>
            <label>
              最大商品
              <input id="create-max-products" type="number" min="1" value="20" />
            </label>
            <label>
              最大 URL
              <input id="create-max-urls" type="number" min="1" value="100" />
            </label>
            <label>
              最大秒数
              <input id="create-max-seconds" type="number" min="1" value="180" />
            </label>
            <button id="create-submit" type="submit">创建并启动</button>
          </form>
          <p id="rule-context" class="muted"></p>
          <div id="create-status" class="status" role="status"></div>
        </details>

        <form id="filters" class="filters">
          <label>
            状态
            <select id="filter-state">
              <option value="">全部</option>
              <option value="DRAFT">草稿</option>
              <option value="QUEUED">排队中</option>
              <option value="RUNNING">运行中</option>
              <option value="PAUSING">暂停中</option>
              <option value="PAUSED">已暂停</option>
              <option value="CANCELLING">取消中</option>
              <option value="CANCELLED">已取消</option>
              <option value="FINISHED">已结束</option>
            </select>
          </label>
          <label>
            类型
            <select id="filter-type">
              <option value="">全部</option>
              <option value="product">商品</option>
              <option value="discovery">发现</option>
            </select>
          </label>
          <label class="check">
            <input id="filter-archived" type="checkbox" />
            包含归档
          </label>
        </form>

        <div id="list-status" class="status" role="status"></div>
        <p class="table-hint list-hint">窄屏已折叠次要列，完整信息见任务详情。</p>
        <div class="table-wrap">
          <table class="list-table">
            <thead>
              <tr>
                <th class="col-task">任务</th>
                <th class="col-type">类型</th>
                <th class="col-site">站点 / 方案</th>
                <th class="col-market">市场</th>
                <th class="col-state">状态</th>
                <th class="col-result">结果</th>
                <th class="col-counts">计数</th>
                <th class="col-updated">更新时间</th>
              </tr>
            </thead>
            <tbody id="task-rows"></tbody>
          </table>
        </div>
      </section>

      <section id="detail-view" hidden>
        <div class="page-head">
          <div>
            <a href="#/tasks" class="back">← 返回任务列表</a>
            <h1 id="detail-title">任务详情</h1>
          </div>
          <div class="actions">
            <button id="refresh-detail" type="button">刷新</button>
            <a id="export-link" class="button-link" href="#" download>导出 zip</a>
          </div>
        </div>

        <div id="detail-controls" class="control-row detail-controls"></div>
        <div id="detail-status" class="status" role="status"></div>
        <div id="detail-counts" class="counts"></div>
        <div id="detail-meta" class="meta-grid"></div>
        <div id="detail-quality" class="panel"></div>

        <div class="tabs" role="tablist">
          <button type="button" class="tab active" data-kind="product">商品</button>
          <button type="button" class="tab" data-kind="url">网址</button>
        </div>
        <div id="items-status" class="status" role="status"></div>
        <p class="table-hint items-hint">窄屏下可横向滚动查看更多列。</p>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>URL</th>
                <th>状态</th>
                <th>失败分类</th>
                <th>尝试</th>
              </tr>
            </thead>
            <tbody id="item-rows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
