schema_version: "1.1"
# Shopify stores: set schema_version: "1.3" and add product_source; see the build brief.
rule_id: "example-shop-build"
rule_version: "2026.11.23-1"
kind: declarative
status: candidate
created_at: "2026-11-23T00:00:00Z"
updated_at: "2026-11-23T00:00:00Z"

# Generic reference only. Replace site values and selectors after inspecting the
# target site; do not copy this file unchanged.
site:
  name: "Example Shop"
  entry_urls: ["https://example.com/"]
  allowed_origins: ["https://example.com"]
  allowed_path_prefixes: ["/"]
  market: "US"
  locale: "en-US"
  currency: "USD"

scope:
  include: []
  exclude:
    - "/cart"
    - "/checkout"
    - "/account"
  max_products: 6
  max_seconds: 180
  notes: "Bounded entry-page sample; not full-site coverage."

capabilities:
  discovery: true
  product: true

discovery:
  strategies: ["entry_links"]
  entry_url: "https://example.com/"
  link_selector: "a.product-link"
  product_url_patterns: ["/products/[^/]+$"]
  url_identity: "canonical"
  notes: "Use product links visible on the entry page, or switch to a listing source."
  # For a target build on a challenge site, put the entry/listing source first
  # and the sitemap second; a sitemap-only source pays the cold challenge on
  # the first document request.
  # sources:
  #   - type: listing
  #     url: "https://example.com/"
  #     product_link_selector: "a.product-link"
  #   - type: sitemap
  #     urls: ["https://example.com/sitemap.xml"]
  #     max_sitemaps: 3

fetch:
  default_engine: "static"
  concurrency: 1
  delay_ms: 1000
  retry: {max_attempts: 2, backoff_ms: 1000}
  timeout_ms: 45000
  browser: false
  login: false
  challenge_handling: "none; stop and record"

extract:
  fields:
    name:
      required: true
      fallbacks:
        - {type: json_ld, path: "name", label: "json_ld_name"}
        - {type: css_text, selector: "h1", label: "h1"}
        - {type: title, label: "title"}
    price.amount:
      required: true
      fallbacks:
        - type: json_ld
          path: "offers.price"
          label: "json_ld_offer_price"
          take: "min_positive"
          tax_basis: "unspecified"
        - {type: css_attr, selector: '[itemprop="price"]', attr: "content", label: "itemprop_price"}
        - {type: css_text, selector: ".price", label: "price"}
    price.currency:
      required: true
      fallbacks:
        - {type: json_ld, path: "offers.priceCurrency", label: "json_ld_currency"}
        - {type: css_attr, selector: 'meta[property="product:price:currency"]', attr: "content", label: "meta_currency"}
    primary_image_url:
      required: true
      fallbacks:
        - {type: json_ld, path: "image", label: "json_ld_image"}
        - type: css_attr
          selector: 'meta[property="og:image"]'
          attr: "content"
          label: "og_image"
          absolute: true
    description_html:
      required: false
      fallbacks:
        - {type: json_ld, path: "description", label: "json_ld_description", description_status: "complete"}
        - type: css_html
          selector: ".product-description"
          label: "description"
          description_status: "complete"
    category:
      required: false
      fallbacks:
        - {type: json_ld, path: "category", label: "json_ld_category"}
        - type: breadcrumb
          selector: "nav.breadcrumb a"
          label: "breadcrumb"
          drop_last: true
    brand:
      required: false
      fallbacks:
        - {type: json_ld, path: "brand.name", label: "json_ld_brand"}
        - {type: css_text, selector: '[itemprop="brand"]', label: "itemprop_brand"}
    source_url:
      required: true
      fallbacks:
        - {type: canonical, label: "canonical"}

normalize:
  price:
    tax_basis: "exclusive_or_inclusive"
    choose: "smaller_public_pair"
    positive_only: true
  description:
    mode: "clean_html"
    statuses: ["complete", "partial", "not_provided", "failed"]
  options:
    exclude_quantity: true
    strip_price_delta: true

validate:
  required_fields:
    - "name"
    - "price.amount"
    - "price.currency"
    - "primary_image_url"
    - "source_url"
  assertions:
    - {field: "price.amount", op: ">", value: 0}
    - {field: "price.currency", op: "matches", value: "^[A-Z]{3}$"}
  partial_description: "allowed_with_flag"

output:
  url_list:
    enabled: true
    columns: ["url", "source", "status", "title"]
    format: "csv"
  product_csv:
    enabled: true
    columns: 9
    format: "csv"
  task_result: true

task_defaults:
  max_urls: 18
  max_products: 6
  max_seconds: 180
  concurrency:
    navigation: 1
    product: 1

compatibility:
  os: ["windows", "linux", "wsl2"]
  runtime: "python>=3.11"
  dependencies: ["pyyaml", "lxml"]

evidence:
  sample_urls: []
  expected:
    - "At least one valid product from the entry-page sample."
  limitations:
    - "Reference template; replace site values and verify selectors."
