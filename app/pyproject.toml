[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecom-crawler"
version = "0.1.0"
description = "D02 data contract and export CLI for the AI e-commerce crawler"
requires-python = ">=3.11"
dependencies = ["lxml>=5.3,<7"]

[project.optional-dependencies]
dev = ["jsonschema>=4.23"]

[project.scripts]
ecom-crawler = "ecom_crawler.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ecom_crawler"]

[tool.ruff]
line-length = 100
target-version = "py311"
