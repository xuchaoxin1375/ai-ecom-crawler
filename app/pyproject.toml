[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecom-crawler"
version = "0.1.0"
description = "D02 data contract and export CLI for the AI e-commerce crawler"
requires-python = ">=3.11"
dependencies = [
    "browserforge==1.2.4",
    "curl_cffi==0.17.0",
    "fastapi>=0.115,<1",
    "lxml>=5.3,<7",
    "patchright==1.64.4",
    "protego>=0.3,<1",
    "pyyaml==6.0.3",
    "scrapling==0.5.1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "jsonschema>=4.23"]

[project.scripts]
ecom-crawler = "ecom_crawler.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ecom_crawler"]

[tool.ruff]
line-length = 100
target-version = "py311"
