[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecom-crawler"
version = "0.1.0"
description = "Declarative e-commerce crawler runtime, browser adapter and export CLI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "lxml>=5.3,<7",
    "patchright==1.64.4",
    "protego>=0.3,<1",
    "pyyaml==6.0.3",
    "scrapling[fetchers]==0.5.1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "jsonschema>=4.23", "ruff>=0.17.6"]

[project.scripts]
ecom-crawler = "ecom_crawler.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ecom_crawler"]

[tool.ruff]
line-length = 100
target-version = "py311"
