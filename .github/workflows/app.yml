name: app

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node for dependency bridge tests
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        # 固定本机验证过的版本；升级时同时复跑 --frozen 检查。
        run: python -m pip install "uv==0.13.9"

      - name: Sync backend dependencies
        run: python -m uv sync --project app --extra dev --frozen

      - name: Install Chromium
        run: python -m uv run --project app --extra dev --frozen --no-sync python -m patchright install --with-deps chromium

      - name: Run backend tests
        run: python -m uv run --project app --extra dev --frozen --no-sync python app/tests/run.py all -q

      - name: Run Ruff
        run: python -m uv run --project app --extra dev --frozen --no-sync ruff check app

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Lint
        working-directory: app/frontend
        run: npm run lint

      - name: Typecheck
        working-directory: app/frontend
        run: npm run typecheck

      - name: Test
        working-directory: app/frontend
        run: npm test

      - name: Format check
        working-directory: app/frontend
        run: npm run format:check

      - name: Build
        working-directory: app/frontend
        run: npm run build
