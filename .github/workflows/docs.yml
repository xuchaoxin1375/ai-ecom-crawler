name: docs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check documentation links
        run: python scripts/check_docs_links.py --require-tracked

      - name: Check example consistency
        run: python scripts/check_examples.py

      - name: Export documentation package
        run: python scripts/export_docs.py

      - name: Verify exported documentation package
        run: python scripts/export_docs.py --check dist/ai-ecom-crawler-docs.zip
